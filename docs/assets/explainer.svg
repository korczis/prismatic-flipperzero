<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" width="1280" height="240" role="img" aria-labelledby="et ed">
  <title id="et">How Prismatic Pocket works</title>
  <desc id="ed">The Kompendium is compiled into a knowledge pack on the SD card, which the Flipper reads one record at a time. Generated by tools/docs.py from the pack's build report.</desc>
  <rect width="1280" height="240" rx="20" fill="#0b0f19"/>
  <rect x="40" y="40" width="260" height="160" rx="14" fill="#141026" stroke="#c08bff" stroke-width="2"/>
  <text x="60" y="80" fill="#c08bff" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700">The knowledge</text>
  <text x="60" y="118" fill="#d9d4f2" font-family="Helvetica, Arial, sans-serif" font-size="19">2 227 objects</text>
  <text x="60" y="146" fill="#d9d4f2" font-family="Helvetica, Arial, sans-serif" font-size="19">65 chapters</text>
  <text x="60" y="174" fill="#d9d4f2" font-family="Helvetica, Arial, sans-serif" font-size="19">37 567 typed links</text>
  <path d="M308 120 h34 m-10 -9 l10 9 l-10 9" fill="none" stroke="#d9d4f2" stroke-width="3" stroke-linecap="round"/>
  <rect x="350" y="40" width="260" height="160" rx="14" fill="#141026" stroke="#ffa940" stroke-width="2"/>
  <text x="370" y="80" fill="#ffa940" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700">The compiler</text>
  <text x="370" y="118" fill="#d9d4f2" font-family="Helvetica, Arial, sans-serif" font-size="19">tools/pocket.py</text>
  <text x="370" y="146" fill="#d9d4f2" font-family="Helvetica, Arial, sans-serif" font-size="19">deterministic: same input,</text>
  <text x="370" y="174" fill="#d9d4f2" font-family="Helvetica, Arial, sans-serif" font-size="19">same bytes</text>
  <path d="M618 120 h34 m-10 -9 l10 9 l-10 9" fill="none" stroke="#d9d4f2" stroke-width="3" stroke-linecap="round"/>
  <rect x="660" y="40" width="260" height="160" rx="14" fill="#141026" stroke="#5fe38a" stroke-width="2"/>
  <text x="680" y="80" fill="#5fe38a" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700">The pack on SD</text>
  <text x="680" y="118" fill="#d9d4f2" font-family="Helvetica, Arial, sans-serif" font-size="19">19.7 MiB .pkp</text>
  <text x="680" y="146" fill="#d9d4f2" font-family="Helvetica, Arial, sans-serif" font-size="19">read a record at a time</text>
  <text x="680" y="174" fill="#d9d4f2" font-family="Helvetica, Arial, sans-serif" font-size="19">2 KiB block cache</text>
  <path d="M928 120 h34 m-10 -9 l10 9 l-10 9" fill="none" stroke="#d9d4f2" stroke-width="3" stroke-linecap="round"/>
  <rect x="970" y="40" width="260" height="160" rx="14" fill="#141026" stroke="#ff8a00" stroke-width="2"/>
  <text x="990" y="80" fill="#ff8a00" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700">The Flipper</text>
  <text x="990" y="118" fill="#d9d4f2" font-family="Helvetica, Arial, sans-serif" font-size="19">Library &#183; Detect</text>
  <text x="990" y="146" fill="#d9d4f2" font-family="Helvetica, Arial, sans-serif" font-size="19">Act &#183; Train</text>
  <text x="990" y="174" fill="#d9d4f2" font-family="Helvetica, Arial, sans-serif" font-size="19">2 856 questions</text>
</svg>
