<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Prismatic for Flipper Zero</title>
  <desc id="d">A white beam enters a prism and leaves as a spectrum of seven rays, beside the word PRISMATIC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#1a1230"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="px" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#px)"/>
  <!-- incoming beam -->
  <line x1="40" y1="250" x2="214" y2="196" stroke="#ffffff" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <!-- spectrum -->
  <g stroke-width="7" stroke-linecap="round" filter="url(#glow)" opacity="0.95">
    <line x1="300" y1="182" x2="620" y2="70"  stroke="#ff3b3b"/>
    <line x1="300" y1="184" x2="620" y2="112" stroke="#ff8a00"/>
    <line x1="300" y1="186" x2="620" y2="154" stroke="#ffd400"/>
    <line x1="300" y1="188" x2="620" y2="196" stroke="#38d96b"/>
    <line x1="300" y1="190" x2="620" y2="238" stroke="#20b8ff"/>
    <line x1="300" y1="192" x2="620" y2="280" stroke="#4d5bff"/>
    <line x1="300" y1="194" x2="620" y2="322" stroke="#a24dff"/>
  </g>
  <!-- prism -->
  <polygon points="250,60 140,300 360,300" fill="url(#glass)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <line x1="214" y1="196" x2="300" y2="188" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
  <!-- wordmark -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ffffff">
    <text x="680" y="170" font-size="84" font-weight="700" letter-spacing="6">PRISMATIC</text>
    <text x="684" y="222" font-size="26" fill="#ff8a00" letter-spacing="2">FOR FLIPPER ZERO</text>
    <text x="684" y="270" font-size="20" fill="#b8b3d6">a pocket epistemic terminal · native FAP · offline</text>
  </g>
</svg>
