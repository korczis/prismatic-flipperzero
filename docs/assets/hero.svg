<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Prismatic Pocket for Flipper Zero</title>
  <desc id="d">White light labelled "the Kompendium" enters a prism and leaves as six coloured rays named detect, inspect, understand, apply, verify and learn, beside the words Prismatic Pocket.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="0.6" stop-color="#141026"/>
      <stop offset="1" stop-color="#1d1236"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.27" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#ff8a00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="px" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#px)"/>
  <rect width="1280" height="420" rx="20" fill="url(#halo)"/>

  <!-- incoming light -->
  <line x1="24" y1="300" x2="222" y2="226" stroke="#ffffff" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <text x="40" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#d9d4f2" transform="rotate(-20 40 330)">the Kompendium</text>

  <!-- spectrum: six capabilities -->
  <g stroke-width="7" stroke-linecap="round" filter="url(#glow)">
    <line x1="318" y1="210" x2="610" y2="62"  stroke="#ff3b3b"/>
    <line x1="318" y1="213" x2="610" y2="122" stroke="#ff8a00"/>
    <line x1="318" y1="216" x2="610" y2="182" stroke="#ffd400"/>
    <line x1="318" y1="219" x2="610" y2="242" stroke="#38d96b"/>
    <line x1="318" y1="222" x2="610" y2="302" stroke="#20b8ff"/>
    <line x1="318" y1="225" x2="610" y2="362" stroke="#a24dff"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2">
    <text x="622" y="67"  fill="#ff6b6b">DETECT</text>
    <text x="622" y="127" fill="#ffa940">INSPECT</text>
    <text x="622" y="187" fill="#ffe14d">UNDERSTAND</text>
    <text x="622" y="247" fill="#5fe38a">APPLY</text>
    <text x="622" y="307" fill="#5cc8ff">VERIFY</text>
    <text x="622" y="367" fill="#c08bff">LEARN</text>
  </g>

  <!-- prism -->
  <polygon points="262,70 148,330 376,330" fill="url(#glass)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <line x1="222" y1="226" x2="318" y2="216" stroke="#ffffff" stroke-width="4" opacity="0.75"/>

  <!-- wordmark -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ffffff">
    <text x="790" y="170" font-size="64" font-weight="700" letter-spacing="5">PRISMATIC</text>
    <text x="792" y="236" font-size="64" font-weight="700" letter-spacing="5" fill="#ff8a00">POCKET</text>
    <text x="794" y="282" font-size="19" fill="#d9d4f2">the epistemic Swiss Army knife</text>
    <text x="794" y="310" font-size="19" fill="#d9d4f2">for Flipper Zero: offline, evidence-first</text>
  </g>
</svg>
