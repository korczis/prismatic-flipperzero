# Applications: assessments the device walks through one scale at a time (capability "assess").
# Each is a knowledge object whose `axis` tables are its scales; a scale's `level` tables are
# its grades, top to bottom, as [code, label, meaning]; a meaning is empty where the source
# gives none. The device asks one scale at a time and shows the grade with what
# it means, then the object's `actions` (what to do with the grade) and `validation` (the rules
# of grading). Every level here is copied from its source, which `provenance` names; nothing is
# invented, and no grade is computed for you: you choose, the device records and explains.
#
# Publication: the owner asked on 2026-11-25 to add "ruzne aplikace (rozumej hodnoceni,
# prismatic veci, etc)" to this public project; see knowledge/LICENSE.md.

[[application]]
id = "applications/admiralty-code"
title = "Admiralty code: grade a source and a claim"
code = "NATO"
definition = "The NATO Admiralty System grades a report twice: how reliable its source is (A to F) and how credible this piece of information is (1 to 6). The two combine into a code like B2. Grade the source and the claim separately."
actions = [
  "Record the code with its reasoning and with each source that corroborates or contradicts the claim.",
  "When the evidence is thin, prefer F and 6 over guessing.",
]
validation = [
  "Base the letter on the source's provenance and track record, not on whether you like the claim.",
  "Base the digit on corroboration: independent sources raise credibility; contradiction or a single source lowers it.",
  "The same source repeated is not corroboration.",
  "Use probabilistic, non-accusatory language and state uncertainty plainly.",
]
provenance = { repository = "https://gitlab.com/korczis/prismatic-platform", commit = "49adc18f7bac", path = "apps/prismatic/priv/prompt_library_seeds/osint-assess-source-reliability.json" }

  [[application.axis]]
  name = "Source reliability"
  levels = [
    ["A", "Completely reliable", "Authoritative, with a proven track record."],
    ["B", "Usually reliable", ""],
    ["C", "Fairly reliable", ""],
    ["D", "Not usually reliable", ""],
    ["E", "Unreliable", ""],
    ["F", "Reliability cannot be judged", ""],
  ]

  [[application.axis]]
  name = "Information credibility"
  levels = [
    ["1", "Confirmed by independent sources", ""],
    ["2", "Probably true", ""],
    ["3", "Possibly true", ""],
    ["4", "Doubtful", ""],
    ["5", "Improbable", ""],
    ["6", "Truth cannot be judged", ""],
  ]

[[application]]
id = "applications/dd-evidence-level"
title = "Due diligence: evidence level of a finding"
code = "DD"
definition = "Prismatic's due-diligence levels say how far a finding has been checked, from a raw adapter result (0) to adversarial forensic verification (9). Each level adds sources, confidence or checks to the one below it."
actions = [
  "Level 5 (cross-validated) is the first level marked decision-grade.",
  "Level 9 (adversarial forensic) is for deal-breaker verification.",
]
validation = [
  "Count only independent sources; the level's minimum number of sources must be met.",
  "Flag contradictions from level 5 up instead of averaging them away.",
]
provenance = { repository = "https://gitlab.com/korczis/prismatic-platform", commit = "49adc18f7bac", path = "apps/prismatic_dd/lib/prismatic_dd/dd_level.ex" }

  [[application.axis]]
  name = "Evidence level"
  levels = [
    ["9", "Adversarial forensic", "L8 plus tightened thresholds (3+ sources, 0.85+ confidence). For deal-breaker verification."],
    ["8", "EU cross-border", "L7 plus EU-wide business and beneficial-ownership registries."],
    ["7", "Sanctions/PEP screening", "L6 plus sanctions and politically-exposed-person lists."],
    ["6", "Expanded (global)", "L5 plus global OSINT (tech infra, media, professional networks)."],
    ["5", "Cross-validated", "At least 2 independent sources, confidence 0.7+, contradictions flagged. Decision-grade."],
    ["4", "Multi-source confirm", "At least 2 sources, confidence 0.5+. Facts with reasonable agreement."],
    ["3", "NABLA signal plurality", "At least 2 independent sources, confidence 0.3+. NABLA compliance minimum."],
    ["2", "Frame threshold", "One source, confidence 0.3+ (Capital DD frame engine default)."],
    ["1", "Single-source", "One source, any confidence. Baseline presence check."],
    ["0", "Raw ingestion", "Unfiltered findings as returned by any single adapter."],
  ]

[[application]]
id = "applications/osint-confidence"
title = "OSINT confidence: how sure is a finding"
code = "OSINT"
definition = "Prismatic's OSINT confidence framework names five levels of certainty for a finding, each with the confidence it stands for, from confirmed (0.95) to unconfirmed (0.10)."
actions = [
  "Possible and below require additional verification.",
]
validation = [
  "Confirmed needs multiple independent, verified sources.",
  "Weak evidence or contradictory indicators mean unlikely.",
]
provenance = { repository = "https://gitlab.com/korczis/prismatic-platform", commit = "49adc18f7bac", path = "apps/prismatic/lib/prismatic_patterns/adapters/osint_domain_adapter.ex" }

  [[application.axis]]
  name = "Confidence"
  levels = [
    ["0.95", "Confirmed", "Multiple independent sources, verified."],
    ["0.80", "Probable", "Strong evidence, limited verification."],
    ["0.60", "Possible", "Some evidence, requires additional verification."],
    ["0.30", "Unlikely", "Weak evidence, contradictory indicators."],
    ["0.10", "Unconfirmed", "Insufficient evidence, speculation."],
  ]

[[application]]
id = "applications/estimative-probability"
title = "Estimative language: say how likely, in words"
code = "WEP"
definition = "Prismatic's confidence calibration assigns analytic judgments a standard vocabulary: seven terms, each a probability range and a numeric score, from almost certain (95-99%) to remote (1-5%)."
actions = [
  "Assign probability estimates to analytic judgments with this standardized vocabulary.",
]
provenance = { repository = "https://gitlab.com/korczis/prismatic-platform", commit = "49adc18f7bac", path = "apps/prismatic_web/priv/content/glossary/intelligence-analysis.md" }

  [[application.axis]]
  name = "Likelihood"
  levels = [
    ["95-99%", "Almost Certain", "Numeric score 0.95-0.99."],
    ["80-95%", "Very Likely", "Numeric score 0.80-0.95."],
    ["55-80%", "Likely", "Numeric score 0.55-0.80."],
    ["45-55%", "Roughly Even", "Numeric score 0.45-0.55."],
    ["20-45%", "Unlikely", "Numeric score 0.20-0.45."],
    ["5-20%", "Very Unlikely", "Numeric score 0.05-0.20."],
    ["1-5%", "Remote", "Numeric score 0.01-0.05."],
  ]

[[application]]
id = "applications/indicator-age"
title = "Threat indicator: how much its age leaves of it"
code = "IOC"
definition = "An indicator of compromise loses confidence as it ages: an IP flagged six months ago may belong to someone else now. Prismatic's multi-tier decay model multiplies an indicator's confidence by a factor for its age."
actions = [
  "Apply the factor to the indicator's confidence score.",
]
validation = [
  "IP addresses change hands faster than domain names, and file hashes stay stable; a production system applies type-specific decay curves rather than one model.",
]
provenance = { repository = "https://gitlab.com/korczis/prismatic-platform", commit = "49adc18f7bac", path = "apps/prismatic_web/priv/content/glossary/threat-intelligence.md" }

  [[application.axis]]
  name = "Age of the indicator"
  levels = [
    ["1.00", "Under 1 hour", "Fresh indicator, maximum confidence."],
    ["0.95", "1-24 hours", "Very recent, minimal decay."],
    ["0.80", "1-7 days", "Recent, slight decay for infrastructure changes."],
    ["0.50", "7-30 days", "Moderate age, significant infrastructure churn."],
    ["0.25", "30-90 days", "Old indicator, high probability of reassignment."],
    ["0.10", "Over 90 days", "Very old, retained only for historical correlation."],
  ]

# Scorecards: questions whose choices add weights to a base score, clamped, then placed in the
# first band whose `max` it does not exceed. A choice may carry a note the result repeats (a red
# flag and its evidence). Same rules as the source: base, weights, clamp, bands.

[[scorecard]]
id = "applications/executive-frame"
title = "Executive frame: a deal's risk rating before diligence"
code = "DD"
definition = "Prismatic's executive frame rates a deal from its intake before any diligence: a base of 50, raised by gaps in what the intake says, clamped to 0-100 and labelled A (low risk) to F (critical risk)."
validation = [
  "Every adjustment is a gap in the intake, not a finding: the score rates how much is unknown.",
]
base = 50
min = 0
max = 100
bands = [
  [20, "A", "Low Risk", ""],
  [40, "B", "Moderate Risk", ""],
  [60, "C", "Elevated Risk", ""],
  [80, "D", "High Risk", ""],
  [100, "F", "Critical Risk", ""],
]
provenance = { repository = "https://gitlab.com/korczis/prismatic-platform", commit = "49adc18f7bac", path = "apps/prismatic_dd/lib/prismatic_dd/executive_frame.ex" }

  [[scorecard.question]]
  text = "Are key people listed in the intake?"
  choices = [["Yes", 0, ""], ["No", 10, "Unidentified Key Personnel (high): no key people listed in intake. Cannot assess management quality or continuity risk."]]

  [[scorecard.question]]
  text = "Is the jurisdiction known?"
  choices = [["Yes", 0, ""], ["No, empty or unknown", 10, "Unclear Jurisdiction (medium): regulatory and legal framework cannot be assessed."]]

  [[scorecard.question]]
  text = "How urgent is the timeline?"
  choices = [["Standard", 0, ""], ["Urgent", 10, "Compressed Timeline (medium): urgent timeline requested. Reduced time for thorough investigation increases oversight risk."]]

  [[scorecard.question]]
  text = "Is the deal over 50M?"
  choices = [["No", 0, ""], ["Yes", 5, "High Complexity Deal (low): deal size 50M+ introduces multi-layer regulatory, financial, and integration complexity."]]

  [[scorecard.question]]
  text = "Is the risk hypothesis at least 80 characters?"
  choices = [["Yes", 0, ""], ["No, shorter", 10, "Insufficient Risk Hypothesis (high): lack of specificity suggests unclear deal rationale or risk awareness."]]

  [[scorecard.question]]
  text = "Is the deal type one of the named types?"
  choices = [["Yes", 0, ""], ["No, other", 5, ""]]

[[scorecard]]
id = "applications/nominee-risk"
title = "Nominee risk: is an owner a front?"
code = "CER"
definition = "Prismatic's nominee-shareholder check weighs evidence that an owner genuinely runs the company against evidence of a nominee arrangement: from a base of 0.30, each item against a nominee takes 0.15 and each item for one adds 0.25, clamped to 0-1. Shown here in hundredths."
actions = [
  "Missing verifications (beneficial owner register, other affiliations, source of funds) are informational only and do not change the score.",
]
validation = [
  "Each question counts one item; the source can count several operating-business items.",
  "Not being found in legal profession registries counts against a nominee.",
]
base = 30
min = 0
max = 100
bands = [
  [19, "LOW", "Low", "Active business, long involvement, not a legal professional."],
  [34, "LOW-MED", "Low-medium", "Active business but some verification gaps."],
  [49, "MED", "Medium", "Mixed indicators or significant gaps."],
  [69, "HIGH", "High", "Multiple nominee indicators or professional patterns."],
  [100, "CRIT", "Critical", "Confirmed nominee arrangement."],
]
provenance = { repository = "https://gitlab.com/korczis/prismatic-platform", commit = "49adc18f7bac", path = "apps/prismatic_cer/lib/prismatic_cer/nominee_risk.ex" }

  [[scorecard.question]]
  text = "Is there evidence of a real operating business?"
  choices = [["No", 0, ""], ["Yes", -15, ""]]

  [[scorecard.question]]
  text = "Did the owner found the company?"
  choices = [["No", 0, ""], ["Yes", -15, "Founded the company (genuine involvement indicator)."]]

  [[scorecard.question]]
  text = "Has the owner been a director for 2 years or more?"
  choices = [["No", 0, ""], ["Yes", -15, "Established or long-term operational involvement."]]

  [[scorecard.question]]
  text = "Is the owner absent from legal profession registries?"
  choices = [["No, found there", 25, "A legal professional: a nominee indicator."], ["Yes, not found", -15, "Not found in legal profession registries."]]

  [[scorecard.question]]
  text = "Is the owner affiliated with more than 5 companies?"
  choices = [["No", 0, ""], ["Yes", 25, "Affiliated with many companies (pattern indicator)."]]

  [[scorecard.question]]
  text = "Does the company show shell or holding indicators?"
  choices = [["No", 0, ""], ["Yes", 25, "Company has shell/holding company indicators."]]

  [[scorecard.question]]
  text = "Is the ownership exactly 100% or 1%?"
  choices = [["No", 0, ""], ["Yes", 25, "100% or minimal 1% ownership (common in nominee arrangements)."]]

# Calculators: a portable algorithm on the device, its parameters here.

[[calculator]]
id = "applications/bayes-update"
title = "Bayesian update: what independent sources do to a belief"
code = "BAYES"
algorithm = "bayes"
definition = "Prismatic fuses the confidences of independent sources by Bayes' rule, one source at a time: each confidence c updates the belief p to c*p / (c*p + (1-c)(1-p)), starting from 0.5. Below 0.5 a source counts against the finding."
actions = [
  "When multiple independent sources agree on a finding, the combined confidence is higher than any individual source.",
]
validation = [
  "A finding at 0.9 or above is confirmed, at 0.1 or below rejected, otherwise tentative (the hypothesis lifecycle of apps/prismatic_ir_pvm/lib/ir/hypothesis.ex).",
]
prior = 50
confirm = 90
reject = 10
choices = [10, 30, 60, 70, 80, 90, 95]
provenance = { repository = "https://gitlab.com/korczis/prismatic-platform", commit = "49adc18f7bac", path = "apps/prismatic_osint_core/lib/prismatic_osint_core/intelligence/correlation_engine.ex" }
